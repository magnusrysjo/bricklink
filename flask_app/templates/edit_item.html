{% extends "base.html" %}
{% block title %}Redigera – {{ item.item.no }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title">Redigera: {{ item.item.no }} – {{ item.item.name }}</h4>
        <p class="text-muted">Inventory ID: {{ item.inventory_id }} | Färg: {{ item.color_name }}</p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Antal</label>
            <input type="number" name="quantity" class="form-control" value="{{ item.quantity }}" min="0">
          </div>
          <div class="mb-3">
            <label class="form-label">Pris per styck</label>
            <input type="text" name="unit_price" class="form-control" value="{{ item.unit_price }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Beskrivning</label>
            <input type="text" name="description" class="form-control" value="{{ item.description or '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Anmärkning (remarks)</label>
            <input type="text" name="remarks" class="form-control" value="{{ item.remarks or '' }}">
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Spara</button>
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Avbryt</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
